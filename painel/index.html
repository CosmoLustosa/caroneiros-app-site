<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/painel/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MeLeva — O app que te leva mais longe. Caronas e Encomendas.">

  <!-- iOS Safari PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeLeva">
  <meta name="theme-color" content="#7E22CE">
  <meta name="msapplication-TileColor" content="#7E22CE">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>MeLeva — Caronas e Encomendas</title>
  <link rel="manifest" href="manifest.json">

  <!-- Viewport optimized for iPhone Notch, Island & Full Height -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background-color: #FFFFFF;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      background-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
    }

    #splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      max-width: 180px;
      max-height: 180px;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      var splash = document.getElementById("splash");
      if (splash) {
        splash.classList.add("fade-out");
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
          var branding = document.getElementById("splash-branding");
          if (branding && branding.parentNode) {
            branding.parentNode.removeChild(branding);
          }
          document.body.style.background = "transparent";
        }, 400);
      }
    }
  </script>
</head>
<body>
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="MeLeva">
  </picture>

  <!-- Flutter Loader Script -->
  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
